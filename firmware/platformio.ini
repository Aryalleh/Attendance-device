; RFID access controller + RC522, on either board:
;   pio run -e d1_mini  -t upload     Wemos D1 mini (ESP8266)  -- the default
;   pio run -e esp32dev -t upload     ESP32 DevKit (ESP-WROOM-32, 30/38-pin)
[platformio]
default_envs = d1_mini

[common]
monitor_speed = 115200
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    bblanchon/ArduinoJson@^7.0.4

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = 921600
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
lib_deps = ${common.lib_deps}

[env:esp32dev]
platform = espressif32@6.9.0      ; Arduino-ESP32 core 2.0.17
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv  ; 3 MB app (TLS + web server need room), ~900 KB LittleFS
lib_deps = ${common.lib_deps}
