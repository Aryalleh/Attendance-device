<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نمایشگر تردد</title>
<link rel="preload" href="/static/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Vazirmatn";src:url("/static/fonts/Vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:swap}
/* SecureEntry kiosk, as designed in UX Pilot (SecureEntry - Kiosk_Idle / Kiosk_Granted / Kiosk_Granted_FA) */
:root{--slate-900:#0f172a;--slate-800:#1e293b;--slate-700:#334155;--slate-500:#64748b;--slate-400:#94a3b8;--slate-50:#f8fafc;
  --indigo-600:#4f46e5;--indigo-400:#818cf8;--indigo-100:#e0e7ff;
  --green-500:#22c55e;--green-400:#4ade80;--red-500:#ef4444;--red-400:#f87171;--amber-500:#f59e0b;--amber-400:#fbbf24}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--slate-900);color:var(--slate-50);font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
h1,h2,p{margin:0}
button,select{font:inherit;color:inherit}
.fa{display:inline-block;height:1em;width:auto;fill:currentColor;vertical-align:-.125em}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{height:80px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 32px;
  background:var(--slate-800);border-bottom:1px solid var(--slate-700)}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{width:40px;height:40px;flex:none;border-radius:12px;background:var(--indigo-600);display:grid;place-items:center;color:#fff;font-size:20px}
.brand h1{font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:12px;font-weight:500;color:var(--slate-400)}
.brand select{background:transparent;border:0;padding:0;font-size:12px;font-weight:500;color:var(--slate-400);cursor:pointer}
.brand select option{background:var(--slate-800);color:var(--slate-50)}
.right{display:flex;align-items:center;gap:24px;flex:none}
.pill{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;border:1px solid;
  background:#22c55e26;color:var(--green-400);border-color:#22c55e4d}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--green-500)}
.pill span{font-size:12px;font-weight:700;letter-spacing:.05em}
.pill.off{background:#ef444426;color:var(--red-400);border-color:#ef44444d}.pill.off i{background:var(--red-500)}
.pill.warn{background:#f59e0b26;color:var(--amber-400);border-color:#f59e0b4d}.pill.warn i{background:var(--amber-500)}
.pill.none{background:#64748b26;color:var(--slate-400);border-color:#64748b4d}.pill.none i{background:var(--slate-500)}
.clock{font-size:24px;font-weight:700;color:#fff;direction:ltr}
.tools{display:flex;gap:8px}
.tools button,.tools a{width:40px;height:40px;border-radius:12px;background:var(--slate-900);border:1px solid var(--slate-700);
  display:grid;place-items:center;cursor:pointer;color:var(--slate-400);text-decoration:none;font-size:16px}
body.kiosk .tools{display:none}

/* stage */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.stage .pill{display:none}
.ringwrap{position:relative;width:320px;height:320px;display:flex;align-items:center;justify-content:center}
.pulse{position:absolute;inset:0;border:4px solid #4f46e54d;border-radius:50%;animation:pulse 2.4s infinite cubic-bezier(.4,0,.6,1)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.8}}
.ring{width:256px;height:256px;border:8px solid var(--indigo-600);border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#0f172a80;color:var(--indigo-400);font-size:72px}
.idle-text{margin-top:48px}
.idle-text h2{font-size:36px;font-weight:800;color:#fff;margin-bottom:16px}
.idle-text p{font-size:20px;color:var(--slate-400)}
.idle-text small{display:block;font-size:14px;font-weight:500;color:var(--slate-500);margin-top:24px}
.result{display:none;flex-direction:column;align-items:center}
.result .ring{margin-bottom:48px;font-size:96px}
.result .title{font-size:36px;font-weight:700;margin-bottom:8px;letter-spacing:.025em}
.result .name{font-size:88px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:16px;max-width:92vw;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-bottom:.08em}
.result .sub{font-size:24px;color:var(--slate-400)}
.uid{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
.holdbar{margin-top:64px;width:384px;max-width:80vw;height:6px;background:var(--slate-800);border-radius:999px;overflow:hidden}
.holdbar i{display:block;height:100%;width:100%}
.stage.showing .ringwrap,.stage.showing .idle-text{display:none}
.stage.showing .result{display:flex}
.pop{animation:pop .45s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.run .holdbar i{animation:shrink var(--hold) linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.k-ok .ring{border-color:var(--green-500);background:#22c55e1a;color:var(--green-500)}.k-ok .title{color:var(--green-400)}.k-ok .holdbar i{background:var(--green-500)}
.k-bad .ring{border-color:var(--red-500);background:#ef44441a;color:var(--red-500)}.k-bad .title{color:var(--red-400)}.k-bad .holdbar i{background:var(--red-500)}
.k-info .ring{border-color:var(--indigo-600);background:#4f46e51a;color:var(--indigo-400)}.k-info .title{color:var(--indigo-400)}.k-info .holdbar i{background:var(--indigo-600)}
.k-warn .ring{border-color:var(--amber-500);background:#f59e0b1a;color:var(--amber-500)}.k-warn .title{color:var(--amber-400)}.k-warn .holdbar{display:none}

/* recent scans */
.recent{height:100px;flex:none;display:flex;align-items:center;padding:0 24px;background:var(--slate-800);border-top:1px solid var(--slate-700);overflow:hidden}
.recent>span{font-size:10px;font-weight:700;color:var(--slate-500);letter-spacing:.1em;margin-inline-end:24px;flex:none}
.chips{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty::before{content:"هنوز ترددی ثبت نشده است";font-size:12px;color:var(--slate-500)}
.chip{position:relative;overflow:hidden;flex:none;display:flex;align-items:center;height:56px;min-width:200px;padding:0 12px;
  background:var(--slate-900);border:1px solid var(--slate-700);border-radius:12px}
.chip::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--green-500)}
.chip.bad::before{background:var(--red-500)}.chip.info::before{background:var(--indigo-600)}
.chip .av{width:32px;height:32px;flex:none;border-radius:50%;background:var(--slate-800);display:grid;place-items:center;
  margin-inline-end:12px;font-size:12px;color:var(--slate-400)}
.chip.bad .av{color:var(--red-500)}
.chip b{display:block;font-size:12px;font-weight:700;color:#fff;line-height:1.25;white-space:nowrap}
.chip small{display:block;font-size:10px;color:var(--slate-400);white-space:nowrap}
.chip.dim{opacity:.5}
.chip.active{background:var(--indigo-600);border-color:var(--indigo-400);opacity:1}
.chip.active::before{background:#fff}
.chip.active .av{background:#fff3;color:#fff}
.chip.active small{color:var(--indigo-100)}
body.is-suspended .recent{display:none}

.banner{position:fixed;inset-inline:0;bottom:116px;margin:auto;width:fit-content;max-width:92vw;background:var(--slate-800);
  border:1px solid var(--slate-700);border-radius:12px;padding:10px 18px;font-size:14px;display:none;cursor:pointer}
.banner.show{display:block}

/* phone (SecureEntry - Kiosk_Idle / Kiosk_Granted, 375 px) */
@media (max-width:600px){
  .top{height:64px;padding:0 16px}
  .brand{gap:12px}
  .logo{width:32px;height:32px;border-radius:8px;font-size:14px}
  .brand h1{font-size:14px}
  .brand p,.brand select{display:none}
  .right .pill,.tools{display:none}
  .clock{font-size:18px}
  .stage .pill{display:flex;margin-bottom:32px;padding:4px 12px}
  .stage .pill i{width:6px;height:6px}
  .stage .pill span{font-size:10px}
  .stage.showing .pill{display:none}
  .ringwrap{width:256px;height:256px;margin-bottom:0}
  .ringwrap .ring{width:192px;height:192px;font-size:60px}
  .idle-text{margin-top:48px}
  .idle-text h2{font-size:30px}
  .idle-text p{font-size:18px}
  .idle-text small{font-size:12px}
  .result .ring{width:192px;height:192px;font-size:72px;margin-bottom:32px}
  .result .title{font-size:24px}
  .result .name{font-size:48px;margin-bottom:16px}
  .result .sub{font-size:18px}
  .holdbar{margin-top:40px;width:256px}
  .recent{height:120px;flex-direction:column;align-items:stretch;justify-content:center;padding:0 16px}
  .recent>span{font-size:9px;margin:0 0 12px}
  .chip{height:48px;min-width:160px}
  .chip .av{width:28px;height:28px;font-size:10px;margin-inline-end:8px}
  .chip b{font-size:10px}
  .chip small{font-size:8px}
  .banner{bottom:136px}
}
@media (prefers-reduced-motion:reduce){.pulse,.pop{animation:none}}
</style>
</head>

<header class="top">
  <div class="brand">
    <div class="logo" data-fa="shield-halved"></div>
    <div><h1>__ORG_NAME__</h1>__DOOR_BLOCK__</div>
  </div>
  <div class="right">
    <div class="pill none" id="pill"><i></i><span id="pillText"></span></div>
    <div class="clock num" id="clock">--:--:--</div>
    <div class="tools">
      <button id="snd" title="صدا" aria-label="صدا"></button>
      <button id="fs" title="تمام‌صفحه" aria-label="تمام‌صفحه" data-fa="expand"></button>
      __DASH_OPEN__<a href="/dashboard" title="داشبورد" aria-label="داشبورد" data-fa="chart-line"></a>__DASH_CLOSE__
    </div>
  </div>
</header>

<main class="stage" id="stage">

  <div class="ringwrap">
    <div class="pulse"></div>
    <div class="ring" data-fa="id-card"></div>
  </div>
  <div class="idle-text">
    <h2>آماده برای اسکن</h2>

    <small id="nfcHint">کارت را پشت گوشی، روی محل NFC بگیرید</small>
  </div>
  <div class="result" id="result">
    <div class="ring" id="icon"></div>
    <p class="title" id="title"></p>
    <h2 class="name" id="name"></h2>
    <p class="sub" id="sub"></p>
    <div class="holdbar"><i></i></div>
  </div>
</main>

<footer class="recent"><span>آخرین ترددها</span><div class="chips" id="recent"></div></footer>
<div class="banner" id="audioBanner">برای فعال شدن صدا، یک بار روی صفحه بزنید</div>

};
const fa = n => `<svg class="fa" viewBox="${FA[n][0]}" aria-hidden="true"><path d="${FA[n][1]}"/></svg>`;
document.querySelectorAll('[data-fa]').forEach(el => { el.innerHTML = fa(el.dataset.fa); });
if (KIOSK) document.body.classList.add('kiosk'); else $('nfcHint').remove();

// What to show for each result: same table as the Android overlay
function describe(e) {
  const denied = 'دسترسی رد شد';
  switch (e.result) {
    case 'granted': {
      const dir = e.direction === 'in' ? 'ورود' : e.direction === 'out' ? 'خروج' : '';
      return {kind:'ok', icon: e.direction === 'out' ? 'arrow-right-from-bracket' : 'circle-check',
              title: e.direction === 'out' ? 'خدانگهدار' : e.direction === 'in' ? 'خوش آمدید' : 'دسترسی مجاز', name: e.name,
              sub: [dir ? dir + ' ثبت شد' : '', e.class].filter(Boolean).join(' • '), chip: dir || 'مجاز'};
    }
    case 'unknown':  return {kind:'bad', icon:'circle-xmark', title:denied, name:'کارت ناشناس', sub:`شناسه <span class="uid">${esc(e.uid)}</span> • برای ثبت به مدیر مراجعه کنید`, raw:true};
    case 'disabled': return {kind:'bad', icon:'ban', title:denied, name:e.name, sub:'این کارت مسدود است'};
    case 'expired':  return {kind:'bad', icon:'calendar-xmark', title:denied, name:e.name, sub:'اعتبار این کارت به پایان رسیده است'};
    case 'denied':   return {kind:'bad', icon:'door-closed', title:denied, name:e.name || 'کارت', sub:'این در غیرفعال است'};
    case 'not_member': return {kind:'bad', icon:'user-slash', title:denied, name:e.name, sub: e.class ? `عضو کلاس «${esc(e.class)}» نیستید` : 'عضو این کلاس نیستید', raw:true};
    case 'manual':   return {kind:'info', icon:'door-open', title:'در باز شد', name:e.name || 'باز کردن از پنل', sub:'باز کردن دستی', chip:'باز شدن دستی'};
    default:         return {kind:'bad', icon:'circle-xmark', title:denied, name:e.name, sub:''};
  }
}

// ---- Web Audio: synthesized cues, no audio files needed ----
let ctx = null, muted = false;
try { muted = localStorage.getItem('live-muted') === '1'; } catch (_) {}
function audioReady() { return ctx && ctx.state === 'running'; }
function unlockAudio() {
  try {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume().then(updateAudioUi);
  } catch (_) {}
  updateAudioUi();
}
function tone(freq, at, dur, type = 'sine', vol = 0.22) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(ctx.destination);
  o.start(at); o.stop(at + dur + 0.05);
}
const SOUNDS = {
  ok:   t => { tone(659.3, t, .16); tone(880, t + .11, .22); tone(1318.5, t + .22, .45, 'sine', .14); },  // rising chime
  bad:  t => { tone(185, t, .24, 'square', .10); tone(185, t + .3, .24, 'square', .10); tone(139, t + .6, .5, 'square', .10); }, // buzz
  info: t => { tone(587.3, t, .2); tone(740, t + .14, .35, 'sine', .16); },
};
function play(kind) { if (!muted && audioReady() && SOUNDS[kind]) SOUNDS[kind](ctx.currentTime + 0.02); }
function updateAudioUi() {
  $('snd').innerHTML = fa(muted ? 'volume-xmark' : 'volume-high');
  $('audioBanner').classList.toggle('show', !muted && !audioReady());
}
$('snd').onclick = ev => {
  ev.stopPropagation();
  muted = !muted;
  try { localStorage.setItem('live-muted', muted ? '1' : '0'); } catch (_) {}
  unlockAudio();
  if (!muted) setTimeout(() => play('info'), 60);
};
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('keydown', unlockAudio);

// ---- stage ----
let holdTimer = null, suspended = false;
function render(kind, icon, title, name, sub, raw) {
  const st = $('stage');
  st.className = 'stage showing k-' + kind;
  $('icon').innerHTML = fa(icon);
  $('title').textContent = title;
  $('name').textContent = name || '';
  if (raw) $('sub').innerHTML = sub || ''; else $('sub').textContent = sub || '';
}
function setIdle() {
  if (suspended) return showSuspended();
  $('stage').className = 'stage';
  markChips(false);
}
function showSuspended() {
  render('warn', 'credit-card', 'اشتراک تعلیق شده است', 'کارت‌ها پذیرفته نمی‌شوند',
         'از مدیر سازمان بخواهید اشتراک را در پنل SecureEntry فعال کند.');
}
function showEvent(e) {
  if (suspended) return;
  const d = describe(e), st = $('stage'), res = $('result');
  render(d.kind, d.icon, d.title, d.name, d.sub, d.raw);
  if (!FEED.includes('door=') && !KIOSK && e.door) $('sub').append(' • ' + e.door);
  res.classList.remove('pop'); void res.offsetWidth; res.classList.add('pop');
  st.style.setProperty('--hold', HOLD_MS + 'ms');
  st.classList.remove('run'); void st.offsetWidth; st.classList.add('run');
  markChips(true);
  play(d.kind);
  clearTimeout(holdTimer);
  holdTimer = setTimeout(setIdle, HOLD_MS);
}
function addRecent(e) {
  const d = describe(e), el = document.createElement('div');
  el.className = 'chip ' + d.kind;
  el.dataset.time = e.time;
  el.dataset.label = d.kind === 'bad' ? 'رد شد' : d.chip;
  el.innerHTML = `<div class="av">${fa(d.kind === 'bad' ? 'circle-xmark' : 'user')}</div>` +
                 `<div><b>${esc(e.result === 'unknown' ? 'کارت ناشناس' : (e.name || '—'))}</b><small></small></div>`;
  const box = $('recent');
  box.prepend(el);
  while (box.children.length > 10) box.lastChild.remove();
  markChips(false);
}
// newest chip is highlighted while its result is on screen; older ones fade as in the design
function markChips(active) {
  [...$('recent').children].forEach((el, i) => {
    const now = active && i === 0;
    el.classList.toggle('active', now);
    el.classList.toggle('dim', active ? i > 0 : i > 1);
    el.querySelector('small').textContent = el.dataset.label + ' • ' + (now ? 'همین حالا' : el.dataset.time);
  });
}
function setSuspended(on) {
  if (on === suspended) return;
  suspended = on;
  document.body.classList.toggle('is-suspended', on);
  clearTimeout(holdTimer);
  setIdle();
}

// ---- status pill: offline only after 2 failed polls in a row ----
let fails = 0;
function setPill(cls, text, title) {
  for (const [p, t] of [['pill', 'pillText'], ['pill2', 'pillText2']]) {
    $(p).className = 'pill ' + cls; $(t).textContent = text; $(p).title = title || '';
  }
}
function setDoorState(doors) {
  if (suspended) return setPill('warn', 'تعلیق');
  if (!doors.length) return setPill('none', 'بدون در');
  const online = doors.every(d => d.online);
  const title = doors.map(d => d.name + (d.online ? ': آنلاین' : ': قطع')).join('\n');
  if (online) setPill('', 'آنلاین', title);
  else setPill('off', doors.length > 1 && doors.some(d => d.online) ? 'برخی درها قطع' : 'قطع', title);
}

// ---- polling ----
let lastId = 0, first = true, pollTimer = null, polling = false;
async function poll() {
  if (polling) return;
  polling = true; clearTimeout(pollTimer);
  try {
    const sep = FEED.includes('?') ? '&' : '?';
    const r = await fetch(FEED + sep + (first ? 'init=1' : 'after=' + lastId), {cache: 'no-store'});
    if (r.status === 401) { location.reload(); return; }
    if (!r.ok) throw new Error(r.status === 404 ? 'لینک نمایشگر نامعتبر است (کلید در عوض شده؟)' : 'خطای سرور ' + r.status);
    const j = await r.json();
    if (j.org) setSuspended(!j.org.active);
    for (const e of j.events) {
      lastId = Math.max(lastId, e.id);
      addRecent(e);
      if (!first) showEvent(e);
    }
    setDoorState(j.doors);
    first = false; fails = 0;
  } catch (err) {
    fails++;
    const hard = err.message && !err.message.startsWith('Failed');
    if (fails >= 2 || hard) setPill('off', 'سرور در دسترس نیست', hard ? err.message : '');
  }
  polling = false;
  pollTimer = setTimeout(poll, __POLL_MS__);
}
// the Android door app calls this right after a card scan so the result shows at once
window.pollNow = () => { if (!first) poll(); };

// ---- clock ----
const fmtLong = new Intl.DateTimeFormat('fa-IR', {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false});
const fmtShort = new Intl.DateTimeFormat('fa-IR', {hour: '2-digit', minute: '2-digit', hour12: false});
const phone = matchMedia('(max-width:600px)');
function tick() { $('clock').textContent = (phone.matches ? fmtShort : fmtLong).format(new Date()); }
setInterval(tick, 1000); tick();

// ---- misc: fullscreen, keep screen awake, door selector ----
$('fs').onclick = ev => {
  ev.stopPropagation();
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
};
async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch (_) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
keepAwake();
const sel = $('doorSel');
if (sel) sel.onchange = () => { location.search = sel.value ? '?door=' + sel.value : ''; };

setDoorState([]); setIdle(); updateAudioUi(); poll();
</script>
