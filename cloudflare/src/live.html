<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نمایشگر تردد</title>
<link rel="preload" href="/static/fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Vazirmatn";src:url("/static/fonts/Vazirmatn.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#0e1116;--panel:#161a22;--line:#262c38;--fg:#eef1f6;--mut:#8b93a3;
  --ok:#22c55e;--ok-bg:#0d2a1a;--bad:#ef4444;--bad-bg:#2e1012;--info:#60a5fa;--info-bg:#0f2036}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
button,select{font:inherit;color:inherit}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.door{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut)}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px #22c55e22}.dot.off{background:var(--bad)}
.door select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.clock{margin-inline-start:auto;text-align:end;line-height:1.2}
.clock b{display:block;font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.clock span{color:var(--mut);font-size:14px}
.tools{display:flex;gap:6px}
.tools button,.tools a{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;
  display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--fg)}
.tools svg{width:20px;height:20px}

/* stage */
.stage{display:grid;place-items:center;padding:24px;transition:background .35s ease}
.stage.ok{background:radial-gradient(circle at 50% 40%,var(--ok-bg),var(--bg) 70%)}
.stage.bad{background:radial-gradient(circle at 50% 40%,var(--bad-bg),var(--bg) 70%)}
.stage.info{background:radial-gradient(circle at 50% 40%,var(--info-bg),var(--bg) 70%)}
.card{text-align:center;max-width:900px}
.icon{width:min(34vh,220px);height:min(34vh,220px);margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;
  border:3px solid var(--line);color:var(--mut)}
.icon svg{width:52%;height:52%}
.ok .icon{border-color:var(--ok);color:var(--ok);background:#22c55e14}
.bad .icon{border-color:var(--bad);color:var(--bad);background:#ef444414}
.info .icon{border-color:var(--info);color:var(--info);background:#60a5fa14}
.idle .icon{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.05);opacity:1}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.title{font-size:clamp(22px,4vh,38px);font-weight:600;margin:0}
.ok .title{color:var(--ok)}.bad .title{color:var(--bad)}.info .title{color:var(--info)}
.name{font-size:clamp(40px,10vh,92px);font-weight:800;margin:6px 0 4px;line-height:1.15}
.sub{font-size:clamp(17px,2.8vh,26px);color:var(--mut)}
.uid{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
.idle .title{color:var(--mut);font-weight:500}
.bar{height:4px;background:currentColor;border-radius:2px;margin:26px auto 0;width:220px;opacity:.6;transform-origin:center}
.idle .bar{display:none}
.run .bar{animation:shrink var(--hold) linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* recent strip */
.recent{display:flex;gap:10px;padding:12px 22px 16px;border-top:1px solid var(--line);overflow-x:auto;min-height:84px}
.recent:empty::before{content:"هنوز ترددی ثبت نشده است";color:var(--mut);align-self:center}
.chip{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--mut);
  border-radius:10px;padding:8px 14px;min-width:150px;line-height:1.35}
.chip.ok{border-inline-start-color:var(--ok)}.chip.bad{border-inline-start-color:var(--bad)}.chip.info{border-inline-start-color:var(--info)}
.chip b{display:block;font-size:15px;white-space:nowrap}
.chip span{color:var(--mut);font-size:13px;white-space:nowrap}

/* banners */
.banner{position:fixed;inset-inline:0;top:84px;margin:auto;width:fit-content;max-width:92vw;background:#1f2633;
  border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-size:15px;display:none;cursor:pointer}
.banner.show{display:block}
.banner.err{background:var(--bad-bg);border-color:var(--bad)}
@media (max-width:600px){.top{padding:10px 14px}.clock b{font-size:22px}.recent{padding:10px 14px}}
</style>
</head>
<body>
<div class="top">
  <div class="door">
    <span class="dot" id="dot"></span>
    __DOOR_BLOCK__
  </div>
  <div class="clock"><b id="time">--:--:--</b><span id="date"></span></div>
  <div class="tools">
    <button id="snd" title="صدا" aria-label="صدا"></button>
    <button id="fs" title="تمام‌صفحه" aria-label="تمام‌صفحه"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    __DASH_OPEN__<a href="/dashboard" title="داشبورد" aria-label="داشبورد"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></a>__DASH_CLOSE__
  </div>
</div>

<main class="stage idle" id="stage">
  <div class="card" id="card">
    <div class="icon" id="icon"></div>
    <p class="title" id="title">کارت خود را نزدیک دستگاه کنید</p>
    <div class="name" id="name"></div>
    <div class="sub" id="sub"></div>
    <div class="bar" id="bar"></div>
  </div>
</main>

<div class="recent" id="recent"></div>
<div class="banner" id="audioBanner">🔇 برای فعال شدن صدا، یک بار روی صفحه بزنید</div>
<div class="banner err" id="errBanner"></div>

<script>
const FEED = __FEED__;
const HOLD_MS = 6000;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICONS = {
  idle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h4M7 14h7"/><path d="M17.5 3.5a6 6 0 0 1 3 3M16 1.5a9 9 0 0 1 6 6" opacity=".7"/></svg>',
  ok:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bad:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h5v16h-5"/><path d="M10 8l4 4-4 4M14 12H4"/></svg>',
};
const SPK_ON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const SPK_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>';

// What to show for each result
function describe(e) {
  switch (e.result) {
    case 'granted':
      return {kind:'ok', title: e.direction === 'out' ? 'خدانگهدار' : 'خوش آمدید', name: e.name,
              sub: e.direction === 'in' ? 'ورود ثبت شد' : e.direction === 'out' ? 'خروج ثبت شد' : 'دسترسی مجاز'};
    case 'unknown':  return {kind:'bad', title:'دسترسی رد شد', name:'کارت ناشناس', sub:`شناسه <span class="uid">${esc(e.uid)}</span>`, raw:true};
    case 'disabled': return {kind:'bad', title:'دسترسی رد شد', name:e.name, sub:'این کارت مسدود است'};
    case 'expired':  return {kind:'bad', title:'دسترسی رد شد', name:e.name, sub:'اعتبار این کارت به پایان رسیده است'};
    case 'denied':   return {kind:'bad', title:'دسترسی رد شد', name:e.name || 'کارت', sub:'این در غیرفعال است'};
    case 'manual':   return {kind:'info', title:'در باز شد', name:e.name, sub:'باز کردن دستی'};
    default:         return {kind:'bad', title:e.result, name:e.name, sub:''};
  }
}

// ---- Web Audio: synthesized cues, no audio files needed ----
let ctx = null, muted = false;
try { muted = localStorage.getItem('live-muted') === '1'; } catch (_) {}
function audioReady() { return ctx && ctx.state === 'running'; }
function unlockAudio() {
  try {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume().then(updateAudioUi);
  } catch (_) {}
  updateAudioUi();
}
function tone(freq, at, dur, type = 'sine', vol = 0.22) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(ctx.destination);
  o.start(at); o.stop(at + dur + 0.05);
}
const SOUNDS = {
  ok:   t => { tone(659.3, t, .16); tone(880, t + .11, .22); tone(1318.5, t + .22, .45, 'sine', .14); },  // rising chime
  bad:  t => { tone(185, t, .24, 'square', .10); tone(185, t + .3, .24, 'square', .10); tone(139, t + .6, .5, 'square', .10); }, // buzz
  info: t => { tone(587.3, t, .2); tone(740, t + .14, .35, 'sine', .16); },
};
function play(kind) { if (!muted && audioReady()) SOUNDS[kind](ctx.currentTime + 0.02); }
function updateAudioUi() {
  $('snd').innerHTML = muted ? SPK_OFF : SPK_ON;
  $('audioBanner').classList.toggle('show', !muted && !audioReady());
}
$('snd').onclick = ev => {
  ev.stopPropagation();
  muted = !muted;
  try { localStorage.setItem('live-muted', muted ? '1' : '0'); } catch (_) {}
  unlockAudio();
  if (!muted) setTimeout(() => play('info'), 60);
};
document.addEventListener('pointerdown', unlockAudio);
document.addEventListener('keydown', unlockAudio);

// ---- stage ----
let holdTimer = null;
function setIdle() {
  const st = $('stage');
  st.className = 'stage idle';
  $('icon').innerHTML = ICONS.idle;
  $('title').textContent = 'کارت خود را نزدیک دستگاه کنید';
  $('name').textContent = ''; $('sub').textContent = '';
}
function showEvent(e) {
  const d = describe(e), st = $('stage'), card = $('card');
  st.className = 'stage ' + d.kind;
  $('icon').innerHTML = ICONS[d.kind];
  $('title').textContent = d.title;
  $('name').textContent = d.name || '';
  if (d.raw) $('sub').innerHTML = d.sub; else $('sub').textContent = d.sub;
  if (!FEED.includes('door=') && !__KIOSK__ && e.door) $('sub').append(' · ' + e.door);
  card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  st.style.setProperty('--hold', HOLD_MS + 'ms');
  st.classList.remove('run'); void st.offsetWidth; st.classList.add('run');
  play(d.kind);
  clearTimeout(holdTimer);
  holdTimer = setTimeout(setIdle, HOLD_MS);
}
function addRecent(e) {
  const d = describe(e), el = document.createElement('div');
  el.className = 'chip ' + d.kind;
  el.innerHTML = `<b>${esc(e.result === 'unknown' ? 'کارت ناشناس' : (e.name || '—'))}</b>` +
                 `<span>${esc(e.time)} · ${esc(d.kind === 'ok' ? d.sub : d.title)}</span>`;
  const box = $('recent');
  box.prepend(el);
  while (box.children.length > 10) box.lastChild.remove();
}

// ---- polling ----
let lastId = 0, first = true;
async function poll() {
  try {
    const sep = FEED.includes('?') ? '&' : '?';
    const r = await fetch(FEED + sep + (first ? 'init=1' : 'after=' + lastId), {cache: 'no-store'});
    if (r.status === 401) { location.reload(); return; }
    if (!r.ok) throw new Error(r.status === 404 ? 'لینک نمایشگر نامعتبر است (کلید در عوض شده؟)' : 'خطای سرور ' + r.status);
    const j = await r.json();
    for (const e of j.events) {
      lastId = Math.max(lastId, e.id);
      addRecent(e);
      if (!first) showEvent(e);
    }
    const online = j.doors.length > 0 && j.doors.every(d => d.online);
    $('dot').className = 'dot ' + (j.doors.length ? (online ? 'on' : 'off') : '');
    $('dot').title = j.doors.map(d => d.name + (d.online ? ': متصل' : ': قطع')).join('\n');
    first = false;
    $('errBanner').classList.remove('show');
  } catch (err) {
    $('errBanner').textContent = '⚠ ارتباط با سرور برقرار نیست' + (err.message && !err.message.startsWith('Failed') ? ' — ' + err.message : '');
    $('errBanner').classList.add('show');
  }
  setTimeout(poll, __POLL_MS__);
}

// ---- clock ----
const fmtTime = new Intl.DateTimeFormat('fa-IR', {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false});
const fmtDate = new Intl.DateTimeFormat('fa-IR', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
function tick() {
  const n = new Date(), p = {};
  for (const x of fmtDate.formatToParts(n)) p[x.type] = x.value;
  $('time').textContent = fmtTime.format(n);
  $('date').textContent = `${p.weekday} ${p.day} ${p.month} ${p.year}`;   // دوشنبه ۱۱ آبان ۱۴۰۵
}
setInterval(tick, 1000); tick();

// ---- misc: fullscreen, keep screen awake, door selector ----
$('fs').onclick = ev => {
  ev.stopPropagation();
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
};
async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch (_) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
keepAwake();
const sel = $('doorSel');
if (sel) sel.onchange = () => { location.search = sel.value ? '?door=' + sel.value : ''; };

setIdle(); updateAudioUi(); poll();
</script>
</body>
</html>
